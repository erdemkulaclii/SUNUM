a, 2022", "subtitle": "Rusya bağlantısı kaynak raporlamasına dayanan bir vaka incelemesi.", "visible_word_count": 28}, {"id": "question", "title": "Bu liste hangi coğrafi ve yapısal örüntüleri gösteriyor?", "kicker": "ARAŞTIRMA SORUSU", "display_points": ["Hedef ülke", "Son DNS etiketi", "İlk DNS etiketi tekrarı"], "takeaway": "Araştırma birimi: 311 benzersiz alan adı göstergesi.", "notes": "Araştırma sorusu, hedef dağılımını ve adres yapısını birlikte ele alıyor.\nGözlem birimi benzersiz alan adıdır; operasyon veya kullanıcı değildir.\nÜlke, kaynağın hedef etiketinden alınır; uzantıdan tahmin edilmez.", "cue_sentences": ["Araştırma sorusu, hedef dağılımını ve adres yapısını birlikte ele alıyor.", "Gözlem birimi benzersiz alan adıdır; operasyon veya kullanıcı değildir.", "Ülke, kaynağın hedef etiketinden alınır; uzantıdan tahmin edilmez."], "full_notes": "Ana araştırma sorum şu: Bu listede hedef ülke etiketleri ile alan adlarının sözcüksel yapısı nasıl bir örüntü oluşturuyor? Soruyu üç gözlenebilir değişkene ayırıyorum. Birincisi kaynağın hedef ülke etiketi; ikincisi alan adının en sağındaki DNS etiketi; üçüncüsü aynı ilk etiketin farklı son etiketlerle yeniden kullanılması. Burada sayılan birim alan adıdır. Bir ağın birden fazla adres kullanması mümkün olduğundan, her adresi ayrı bir operasyon gibi değerlendirmiyorum. Aynı şekilde, bir ülke etiketi o ülkedeki kullanıcıların gördüğü içerik veya etkilendiği kişi sayısı anlamına gelmiyor. Bu ayrım, sonuçları baştan daraltmak için değil, ölçülen nesneyi açık tanımlamak için gerekli. Katkı, bu üç değişkeni aynı kayıt zinciri üzerinde karşılaştırmak.", "seconds": 60, "visual": "question", "citations": ["meta2022", "allen2020"], "source": "Meta, 2022; Allen et al., 2020", "visible_word_count": 24}, {"id": "audit", "title": "Denetlenmiş analiz kümesi 311 benzersiz alan adıdır.", "kicker": "VERİ VE YÖNTEM", "display_points": ["350 kayıt → 313 alan adı satırı → 311 benzersiz alan adı"], "takeaway": "Farklı kayıt türleri aynı "Listenin 298 kaydı Almanya hedefli; bütün listedeki payı yüzde 95,8.", "Birleşik Krallık, Fransa ve İtalya birlikte sekiz kayıttır.", "Kalan beş kayıt Letonya, Ukrayna ve çoklu hedef kategorilerindedir.", "Grafik, ülke dağılımını gösterir; neden veya etkiyi açıklamaz."], "full_notes": "İlk bulgu, Almanya hedefli etiketlerin açık ağırlığıdır. Üç yüz on bir benzersiz alan adının iki yüz doksan sekizi bu etiketi taşıyor; bütün listedeki pay yüzde doksan beş virgül sekiz. Birleşik Krallık dört, Fransa iki, İtalya iki göstergeyle yer alıyor. Letonya üç, Ukrayna bir, çoklu hedef kategorisi de bir kayıt içeriyor. Tek bir ülkenin bu kadar baskın olduğu dağılımı yatay çubuk grafik daha doğrudan anlatıyor. Küçük ülkeleri ayrı uzun bölümlere ayırmak yerine aynı tabloda birlikte gösteriyorum. Bu, yayımlanan vakanın hedef yönelimidir. Yoğunlaşmanın ne kadarının faaliyet, ne kadarının tespit veya yayımlama seçimiyle ilgili olduğunu ayıracak ek veri bulunmadığından, grafiği Avrupa’daki bütün operasyonların sıralaması olarak yorumlamıyorum.", "seconds": 95, "visual": "countries", "citations": ["meta2022"], "source": "Meta, 2022", "metric": {"numerator": 298, "denominator": 311, "percentage": 95.8}, "visible_word_count": 22}, {"id": "tlds", "title": "Altı son etiket, 240 alan adında birleşir.", "kicker": "BULGU 2 / SON DNS ETİKETİ", "display_points": ["39 farklı son DNS etiketi", "En sık altı etiket: 240/311 (%77,2)"], "takeaway": "Bu 240 kaydın tamamı Almanya hedeflidir.", "notes": "En sık son etiketler online, website, site, space, pw ve fun.\nBu altı etiket toplam 240 alan adı içeriyor.\nBu 240 kaydın tamamı kaynakta Almanya hedefli etiketlenmiş.\nYapısal dağılımı ölçüyorum; fiyat, barındırma ve operatör bilgisi çıkarmıyorum.", "cue_sentences": ["En sık son etiketler online, website, site, space, pw ve fun.", "Bu altı etiket toplam 240 alan adı içeriyor.", "Bu 240 kaydın tamamı kaynakta Almanya hedefli etiketlenmiş.", "Yapısal dağılımı ölçüyorum; fiyat, barındırma ve operatör bilgisi çıkarmıyorum."], "full_notes": "İkinci bulgu, alan adının en sağındaki etikete bakıyor. Online elli üç, website elli, site kırk altı, space kırk iki, pw yirmi sekiz ve fun yirmi bir kez geçiyor. Altı etiket toplam iki yüz kırk alan adını, yani listenin yüzde yetmiş yedi virgül ikisini kapsıyor. Bu iki yüz kırk kaydın tamamı Almanya hedefli. Böylece coğrafi yoğunlaşmayı yalnız bir ülke toplamı olarak değil, belirli bir adres dağılımıyla birlikte görebiliyoruz. Ancak etiketin sık kullanılması, ucuz olduğunu kanıtlamaz; bunun için döneme ait tescil veya fiyat verisi gerekir. Etiket barındırma ülkesini de göstermiyor. Hesap, kaydın en sağındaki DNS etiketi üzerinden yapıldığı için etkin kayıt son ekiyle karıştırılmamalı.", "seconds": 90, "visual": "tlds", "citations": ["meta2022"], "source": "Meta, 2022", "metric": {"numerator": 240, "denominator": 311, "percentage": 77.2}, "visible_word_count": 24}, {"id": "reuse", "title": "Aynı ilk DNS etiketi farklı son etiketlerle yinelenir.", "kicker": "BULGU 3 / SÖZCÜKSEL TEKRAR", "display_points": ["93 ayrı ilk etiket", "75 tekrarlanan grup; 293 adres"], "takeaway": "Adres çeşitliliği, yinelenen ilk etiketler çevresinde oluşur.", "notes": "Alan adları, soldaki ilk DNS etiketinin tam eşleşmesine göre gruplandı.\n93 ayrı ilk etiketin 75’i birden fazla son etiketle yer alıyor.\nBu gruplar 293 adresi kapsıyor; spiegel dokuz, bild sekiz, dailymail üç örnek içeriyor.\nDize tekrarı, sahiplik veya içerik hakkında bağımsız hüküm vermiyor.", "cue_sentences": ["Alan adları, soldaki ilk DNS etiketinin tam eşleşmesine göre gruplandı.", "93 ayrı ilk etiketin 75’i birden fazla son etiketle yer alıyor.", "Bu gruplar 293 adresi kapsıyor; spiegel dokuz, bild sekiz, dailymail üç örnek içeriyor.", "Dize tekrarı, sahiplik veya içerik hakkında bağımsız hüküm vermiyor."], "full_notes": "Üçüncü bulgu, tam olarak aynı ilk DNS etiketinin yeniden kullanımını inceliyor. Üç yüz on bir alan adında doksan üç farklı ilk etiket var. Bunların yetmiş beşi birden fazla son etiketle birlikte kullanılıyor ve iki yüz doksan üç adres bu gruplarda toplanıyor. Örneğin spiegel ilk etiketi dokuz farklı son etiketle, bild sekiz, dailymail ise üç farklı son etiketle yer alıyor. Burada yazım benzerliğini yorumlayan bir model kullanmadım; yalnızca tam dize eşleşmesini saydım. Bu tercih, ölçümü yeniden üretilebilir ve denetlenebilir tutuyor. Sonuç, listede adres çeşitliliğinin önemli bir bölümünün yinelenen ilk etiketler çevresinde oluştuğunu gösteriyor. Ortak sahiplik, aynı operatör veya içerik taklidi için ise bu sayımın ötesinde kanıt gerekir.", "seconds": 95, "visual": "reuse", "citations": ["meta2022"], "source": "Meta, 2022", "visible_word_count": 24}, {"id": "anatomy", "title": "Haber adı çağrışımı, adresin yapısından ayrılmalıdır.", "kicker": "ALAN ADININ ANATOMİSİ", "display_points": ["theguardian[.]co[.]com", "dailymail[.]top"], "takeaway": "İlk, ara ve son etiket ayrı ölçülür.", "notes": "Theguardian örneğinde ilk etiket, ara etiket ve son etiket farklı parçalardır.\nBenim son etiket sayımım bu kaydı com altında sınıflandırıyor.\nHaber adını çağrıştıran dizeyi görmek, içeriği veya operatörü doğrulamak değildir.", "cue_sentences": ["Theguardian örneğinde ilk etiket, ara etiket ve son etiket farklı parçalardır.", "Benim son etiket sayımım bu kaydı com altında sınıflandırıyor.", "Haber adını çağrıştıran dizeyi görmek, içeriği veya operatörü doğrulamak değildir."], "full_notes": "Bu iki örnek, yapılan ölçümün neyi saydığını somutlaştırıyor. Theguardian nokta co nokta com kaydında ilk etiket theguardian, ara etiket co, son etiket com. Son etiket tablosu bu alan adını com kategorisine yerleştiriyor. Bu, etkin kayıt sınırını veya yasal yayıncı kimliğini hesapladığım anlamına gelmiyor. Dailymail nokta top ise aynı ayrımı daha kısa bir yapıda gösteriyor. Lazer ve arkadaşlarının haber biçimi ile doğruluk süreçleri arasındaki ayrımı, tanıdık bir adın neden araştırmaya değer olduğunu düşünmemize yardım ediyor. Fakat kaynak listedeki bir dizeyi görmek, sitenin içeriğini incelediğimiz anlamına gelmez. Bu örnekler arşivlenmiş göstergelerden seçildi; içerik, niyet ve aktör atfı ayrıca doğrulanmalıdır.", "seconds": 80, "visual": "anatomy", "citations": ["meta2022", "lazer2018"], "source": "Meta, 2022; Lazer et al., 2018", "visible_word_count": 15}, {"id": "limits", "title": "Ölçtüğümüz şey yayımlanmış altyapı göstergeleridir.", "kicker": "YORUM VE GEÇERLİLİK", "display_points": ["Seçilim: tespit ve yayımlama", "Tarih: bütün kayıtlarda 27.09.2022"], "takeaway": "Bu veri faaliyet zamanını, niyeti veya kamuoyu etkisini ölçmez.", "notes": "Liste, platformun tespit ve yayımlama seçimini yansıtıyor.\nBütün kayıtlarda tarih aynı; bundan bir faaliyet zaman çizelgesi üretilemez.\nHedef etiketi, alan adı yapısı ve haber görünürlüğü farklı ölçümlerdir.\nÇıkarımlar bu veri kapsamıyla sınırlı tutuluyor.", "cue_sentences": ["Liste, platformun tespit ve yayımlama seçimini yansıtıyor.", "Bütün kayıtlarda tarih aynı; bundan bir faaliyet zaman çizelgesi üretilemez.", "Hedef etiketi, alan adı yapısı ve haber görünürlüğü farklı ölçümlerdir.", "Çıkarımlar bu veri kapsamıyla sınırlı tutuluyor."], "full_notes": "Bulguları değerlendirirken üç sınır birlikte düşünülmeli. Birincisi, yayımlanmış bu liste olasılıklı bir operasyon örneklemi değil; platformun tespit ve paylaşım seçimini yansıtıyor. İkincisi, dosyadaki üç yüz elli kaydın tamamında ds alanı yirmi yedi Eylül iki bin yirmi iki. Dolayısıyla bu tarihten faaliyetlerin ne zaman başladığı, arttığı veya sona erdiği hakkında bir zaman serisi çıkaramayız. Üçüncüsü, aynı veriyle altyapı sayısından kullanıcıların maruziyetine veya tutum değişikliğine geçemeyiz. Allen ve arkadaşlarının kapsam ve payda üzerine tartışması burada yararlı. Bu sınırlar bulguyu ortadan kaldırmıyor; bulgunun hangi nesne ve hangi evren için geçerli olduğunu belirliyor. Sonuçlarımız ülke etiketleri ve alan adı dizilerinin dağılımına aittir.", "seconds": 75, "visual": "limits", "citations": ["meta2022", "allen2020"], "source": "Meta, 2022; Allen et al., 2020", "visible_word_count": 22}, {"id": "future", "title": "GDELT, ayrı bir tarihsel karşılaştırma için kullanılabilir.", "kicker": "İLERİ ARAŞTIRMA", "display_points": ["Aynı dönem: 2022", "Kaynak coğrafyası ve anılan yerler ayrılmalı."], "takeaway": "Bu karşılaştırma henüz yapılmadı; mevcut sonuçlara dahil değildir.", "notes": "GDELT, bu altyapının haberlerde nasıl görünür olduğunu ayrı bir çalışmada incelemeyi sağlayabilir.\n2022 vakası için aynı döneme ait arşiv ve açık kapsam tanımı gerekir.\nGüncel bir haber seçkisi tarihsel karşılaştırmanın yerine geçmez.", "cue_sentences": ["GDELT, bu altyapının haberlerde nasıl görünür olduğunu ayrı bir çalışmada incelemeyi sağlayabilir.", "2022 vakası için aynı döneme ait arşiv ve açık kapsam tanımı gerekir.", "Güncel bir haber seçkisi tarihsel karşılaştırmanın yerine geçmez."], "full_notes": "Bir sonraki araştırma aşaması, bu altyapının haberlerdeki görünürlüğüdür. Bunun için GDELT kullanılarak aynı tarihsel dönemi kapsayan bir derlem kurulabilir. Ancak güncel DOC sorgusu iki bin yirmi iki tarihli vaka için doğrudan doğrulama sağlamaz; tarihsel arşiv, dönem ve kaynak kapsamı ayrıca belirlenmelidir. Haberi yayımlayan kaynağın ülkesiyle metinde adı geçen yerler de farklı değişkenler olarak kodlanmalı. Özellikle GKG konum alanlarından otomatik biçimde yayıncı ülkesi çıkarmak doğru olmaz. Bu karşılaştırma, mevcut sunumda tamamlanmış bir sonuç olarak yer almıyor. Bugünkü üç bulgu, yalnız Meta listesinin yeniden sayılması ve yapısal çözümlemesinden geliyor. GDELT burada bu sonuçların yerine geçen bir vaat değil, açıkça ayrılmış yeni bir araştırma adımıdır.", "seconds": 60, "visual": "future", "citations": [], "source": "İleri araştırma önerisi; bu çalışmanın tamamlanmış bulgusu değildir.", "visible_word_count": 24}, {"id": "conclusion", "title": "Vaka, Almanya ağırlığı ve tekrarlanan adres yapılarıyla tanımlanır.", "kicker": "SONUÇ", "display_points": ["Almanya payı: %95,8", "75 ilk etiket, birden fazla son etiket"], "takeaway": "Katkı: hedef coğrafyasıyla sözcüksel yapıyı kayıt düzeyinde birlikte göstermek.", "notes": "Araştırma sorusunu üç tamamlanmış bulguyla yanıtlıyorum.\nCoğrafi yoğunlaşmaya, son etiket yoğunlaşması ve ilk etiket tekrarı eşlik ediyor.\nKatkı, bu örüntüleri aynı kaynak kayıtları üzerinde birlikte ve denetlenebilir biçimde göstermek.\nBu sonuçlar bütün operasyonlar veya toplumsal etki hakkında genellenmiyor.", "cue_sentences": ["Araştırma sorusunu üç tamamlanmış bulguyla yanıtlıyorum.", "Coğrafi yoğunlaşmaya, son etiket yoğunlaşması ve ilk etiket tekrarı eşlik ediyor.", "Katkı, bu örüntüleri aynı kaynak kayıtları üzerinde birlikte ve denetlenebilir biçimde göstermek.", "Bu sonuçlar bütün operasyonlar veya toplumsal etki hakkında genellenmiyor."], "full_notes": "Araştırma sorusuna dönerek bitiriyorum. İncelenen Meta iki bin yirmi iki listesi, Almanya hedefli etiketlerde yoğunlaşan ve aynı ilk DNS etiketlerinin farklı son etiketlerle tekrarlandığı bir adres kümesi ortaya koyuyor. Ülke bulgusu, son etiket dağılımı ve tam dize tekrarları birbirinden bağımsız birer evrensel iddia değil; aynı kayıtların farklı boyutlarda tamamlanmış betimsel çözümlemeleri. Çalışmanın katkısını bu nedenle tek cümleyle tanımlıyorum: hedef coğrafyasıyla sözcüksel yapıyı kayıt düzeyinde birlikte göstermek. Bu ifade yeni bir aktör atfı, etki tahmini veya bütün operasyonların haritası iddiası taşımıyor. Sonuç, yayımlanmış bir vaka hakkında dar ama açık bir yanıt veriyor ve daha ileri karşılaştırmalarda hangi değişkenlerin ayrı tutulması gerektiğini gösteriyor.", "seconds": 75, "visual": "conclusion", "citations": ["meta2022"], "source": "Meta, 2022", "visible_word_count": 27}, {"id": "references", "title": "Kaynakça", "kicker": "SEÇİLMİŞ KAYNAKLAR", "display_points": ["Meta (2022): birincil gösterge verisi.", "Lazer ve arkadaşları (2018): kavramsal çerçeve.", "Allen ve arkadaşları (2020): ölçüm ve payda."], "takeaway": "Tam künyeler ve yöntem
