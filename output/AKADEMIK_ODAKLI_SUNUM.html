<div id="modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Kapat">✕</button></div><div id="modal-body"></div></section></div><script id="dataset" type="application/json">{"slides":[{"id":"cover","title":"Hibrit Savaşın Görünmez Cephesi","kicker":"HİBRİT SAVAŞIN GÖRÜNMEZ CEPHESİ","display_points":["Vaka: Doppelgänger (Meta, 2022)","5,9 milyon GDELT haber kaydı"],"takeaway":"Hedeflenen coğrafya ile görünür olan coğrafya.","notes":"Hibrit savaşın görünmez cephesi bilgi alanıdır; bu sunum Rusya’nın Batı Avrupa’ya yönelik dezenformasyon operasyonlarını GDELT verisiyle haritalıyor.\nİki soruya bakıyorum: göstergeler kimi hedefliyor ve vaka haberlerde nerede görünür oldu?\nBirinci kaynak 311 alan adı; ikinci kaynak GDELT arşivindeki 5,9 milyon haber kaydı.\nSunum yaklaşık 20 dakika.","cue_sentences":["Hibrit savaşın görünmez cephesi bilgi alanıdır; bu sunum Rusya’nın Batı Avrupa’ya yönelik dezenformasyon operasyonlarını GDELT verisiyle haritalıyor.","İki soruya bakıyorum: göstergeler kimi hedefliyor ve vaka haberlerde nerede görünür oldu?","Birinci kaynak 311 alan adı; ikinci kaynak GDELT arşivindeki 5,9 milyon haber kaydı.","Sunum yaklaşık 20 dakika."],"full_notes":"Değerli hocalarım ve arkadaşlar, sunumumun başlığı “Hibrit Savaşın Görünmez Cephesi”. Hibrit savaşta askerî olmayan araçlar, özellikle bilgi alanındaki operasyonlar, çoğu zaman görünmeyen bir cephe oluşturur. Bu cepheyi Rusya’nın Batı Avrupa’ya yönelik en kapsamlı dezenformasyon operasyonlarından biri olan Doppelgänger vakası üzerinden haritalıyorum. İki veri kullanıyorum: Meta’nın 27 Eylül 2022’de yayımladığı 311 alan adlık gösterge listesi ve GDELT’in ham haber arşivinden taranan 5,9 milyon kayıt. Amacım operasyonun hangi Batı Avrupa ülkelerini hedeflediğini ve operasyonun ifşasının hangi ülkelerin medyasında görünür olduğunu coğrafi olarak göstermek.","seconds":35,"visual":"cover","citations":["meta2022","gdeltgkg"],"source":"Meta, 2022; The GDELT Project, 2015","subtitle":"GDELT Verisiyle Rusya’nın Batı Avrupa’ya Yönelik Dezenformasyon Operasyonlarının Coğrafi Haritalanması","visible_word_count":29},{"id":"contribution","title":"Operasyonu değil, izlerini ölçmek","kicker":"SORUN VE KATKI","display_points":["Doppelgänger: tanınmış haber markalarını klonlayan Rus etki operasyonu","Hakemli ampirik literatür çok sınırlı"],"takeaway":"Katkı: altyapı tipolojisi ve ifşanın haber coğrafyası.","cue_sentences":["Doppelgänger, gerçek haber markalarını klonlayan ve sonradan Sosyal Tasarım Ajansı ile Structura’ya atfedilen bir etki operasyonu.","Vaka hakkındaki bilgi büyük ölçüde resmî ve gri raporlarda; hakemli ampirik çalışma neredeyse yok.","Bu çalışma iki iz ölçüyor: Meta’nın yayımladığı alan adı altyapısı ve bu altyapının ifşasının uluslararası haber görünürlüğü."],"notes":"Doppelgänger, gerçek haber markalarını klonlayan ve sonradan Sosyal Tasarım Ajansı ile Structura’ya atfedilen bir etki operasyonu.\nVaka hakkındaki bilgi büyük ölçüde resmî ve gri raporlarda; hakemli ampirik çalışma neredeyse yok.\nBu çalışma iki iz ölçüyor: Meta’nın yayımladığı alan adı altyapısı ve bu altyapının ifşasının uluslararası haber görünürlüğü.","full_notes":"Sorunu ve katkımı baştan söylemek istiyorum. Doppelgänger, Spiegel, Bild, The Guardian gibi gerçek haber markalarının görünümünü kopyalayan, Rusya kaynaklı ve sonradan Sosyal Tasarım Ajansı ile Structura şirketlerine atfedilen bir etki operasyonu. Vaka hakkındaki bilgimiz büyük ölçüde EU DisinfoLab, Meta, Fransız VIGINUM ve Alman Dışişleri gibi kurumların raporlarına dayanıyor; vakayı doğrudan inceleyen hakemli ampirik çalışma neredeyse yok. Pamment ve Tsurtsumia’nın 2025 tarihli değerlendirmesi bu boşluğu açıkça gösteriyor. Bu nedenle operasyonun kendisini, yani kimlerin ne kadar etkilendiğini, ölçtüğümü iddia etmiyorum. Ölçtüğüm şey operasyonun izleri: Meta’nın yayımladığı alan adı altyapısı ve bu altyapının ifşasının uluslararası haber coğrafyası.","seconds":50,"visual":"steps","citations":["disinfolab2022","pamment2025","meta2022"],"source":"Alaphilippe et al., 2022; Pamment & Tsurtsumia, 2025; Meta, 2022","steps":[["Vaka","Doppelgänger: haber markası klonlama · Rusya kaynaklı · SDA/Structura’ya atfedildi"],["Boşluk","Bilgi çoğunlukla resmî/gri raporlarda; vakaya özgü hakemli ampirik çalışma çok az"],["Katkı 1","Meta göstergelerinin hedef ve alan adı tipolojisi (311 alan adı)"],["Katkı 2","İfşanın haber görünürlüğü: ham GDELT GKG arşivi (5,9 milyon kayıt)"]],"visible_word_count":24},{"id":"definition","title":"Hibrit savaştan hibrit müdahaleye","kicker":"KAVRAMSAL ÇERÇEVE I","display_points":["Köken: Hoffman (2007), muharebe alanında araçların kaynaşması","Eleştiri: belirsizlik, aşırı genişleme, “Gerasimov doktrini” miti"],"takeaway":"Çalışma tanımı: tespit ve atıf eşiğini istismar eden müdahale.","cue_sentences":["Hibrit savaş kavramı Hoffman’da askeri bir kavramdı; Kırım’dan sonra dezenformasyonu da kapsayacak şekilde genişledi.","Renz, Galeotti, Fridman ve Çalışkan bu genişlemeyi eleştirir; Galeotti “Gerasimov doktrini” etiketini kendisi geri çekmiştir.","Bu yüzden Wigell’in hibrit müdahale kavramını ve Hybrid CoE’nin “tespit ve atıf eşikleri” vurgusunu kullanıyorum.","Görünmez cephe: operasyon eşiğin altında tutulur; kamuoyu çoğu zaman operasyonu değil, yalnızca ifşasını görür."],"notes":"Hibrit savaş kavramı Hoffman’da askeri bir kavramdı; Kırım’dan sonra dezenformasyonu da kapsayacak şekilde genişledi.\nRenz, Galeotti, Fridman ve Çalışkan bu genişlemeyi eleştirir; Galeotti “Gerasimov doktrini” etiketini kendisi geri çekmiştir.\nBu yüzden Wigell’in hibrit müdahale kavramını ve Hybrid CoE’nin “tespit ve atıf eşikleri” vurgusunu kullanıyorum.\nGörünmez cephe: operasyon eşiğin altında tutulur; kamuoyu çoğu zaman operasyonu değil, yalnızca ifşasını görür.","full_notes":"Başlığımdaki “hibrit savaş” kavramını açıkça tanımlamam gerekiyor. Kavram Hoffman’ın 2007 çalışmasında konvansiyonel ve düzensiz araçların aynı muharebe alanında kaynaşmasını anlatan askeri bir kavramdı. Kırım’dan sonra NATO ve AB kavramı dezenformasyonu da içeren “hibrit tehditler” yönünde genişletti. Bu genişleme ciddi eleştiri aldı: Renz kavramın Rus kapasitesini abarttığını, Fridman iki tarafta da siyasallaştığını, Çalışkan ise strateji kuramı açısından yeni bir savaş biçimi olmadığını savunur. “Gerasimov doktrini” ifadesini ortaya atan Galeotti de 2018’de bu etiketi geri çekmiştir. Bu nedenle ben kavramı Wigell’in “hibrit müdahale” kuramı ve Hybrid CoE’nin tanımı anlamında kullanıyorum: savaş eşiğinin altında kalan, tespit ve atıf eşiklerini istismar eden, açık toplumların bilgi altyapısındaki güven ilişkilerini hedef alan, inkâr edilebilir ve askeri olmayan faaliyetler. Mumford ve Carlucci’nin vurguladığı gibi bu müdahalenin çekirdeği belirsizliktir. “Görünmez cephe” derken kastettiğim de budur: operasyon kasıtlı olarak eşiğin altında tutulur ve kamuoyu çoğu zaman operasyonun kendisini değil, yalnızca ifşasını görür.","seconds":90,"visual":"quote","citations":["hoffman2007","renz2016","galeotti2018","fridman2018","caliskan2019","wigell2019","hybridcoe","mumford2023"],"source":"Hoffman, 2007; Renz, 2016; Galeotti, 2018; Fridman, 2018; Caliskan, 2019; Wigell, 2019; Hybrid CoE; Mumford & Carlucci, 2023","quote":"Hibrit müdahale: devlet veya devlet bağlantılı aktörlerin savaş eşiğinin altında kalarak, tespit ve atıf eşiklerini istismar eden, açık toplumların bilgi altyapısındaki güven ilişkilerini hedef alan, koordineli ve inkâr edilebilir askeri olmayan faaliyetleri.","quote_note":"Wigell, 2019; Hybrid CoE; Mumford ve Carlucci, 2023. Birleşik bir Rus “hibrit doktrini” varsayılmaz (Renz, 2016; Galeotti, 2018; Caliskan, 2019).","visible_word_count":27},{"id":"mechanism","title":"Görünmez cephenin mekanizması: anlatı → güven → altyapı","kicker":"KAVRAMSAL ÇERÇEVE II","display_points":["Neden: stratejik anlatı","Nasıl: yansıtıcı kontrol, “yalan hortumu”","Hangi altyapıyla: ödünç alınmış güvenilirlik"],"takeaway":"Klon haber sitesi, güveni ödünç alan ucuz bir altyapıdır.","cue_sentences":["Neden: Miskimmon ve arkadaşlarının stratejik anlatı kavramı; içerikler “Batı’nın çöküşü” anlatısına hizmet eder.","Nasıl: yansıtıcı kontrol ve “yalan hortumu” modelleri yüksek hacim ve çok kanalı açıklar; bunlar kanıtlanmış doktrin değil, yorumlayıcı modellerdir.","Hangi altyapıyla: okur tanıdık marka görünümüne güvenir; Bennett ve Livingston’ın tanımındaki “taklit haber biçimi” tam olarak budur."],"notes":"Neden: Miskimmon ve arkadaşlarının stratejik anlatı kavramı; içerikler “Batı’nın çöküşü” anlatısına hizmet eder.\nNasıl: yansıtıcı kontrol ve “yalan hortumu” modelleri yüksek hacim ve çok kanalı açıklar; bunlar kanıtlanmış doktrin değil, yorumlayıcı modellerdir.\nHangi altyapıyla: okur tanıdık marka görünümüne güvenir; Bennett ve Livingston’ın tanımındaki “taklit haber biçimi” tam olarak budur.","full_notes":"Hibrit müdahale üst çerçeveyi veriyor; operasyonun işleyişini ise üç katmanda açıklıyorum. Neden sorusuna stratejik anlatı kavramı yanıt veriyor: Miskimmon ve arkadaşlarına göre devletler uluslararası düzene dair anlam inşa etmek için iletişim kurar; Doppelgänger içeriklerindeki “yaptırımlar Almanya’ya zarar veriyor” ya da “mülteciler yük” temaları Batı’nın çöküşü anlatısına hizmet eder. Nasıl sorusuna Paul ve Matthews’ın “yalan hortumu” modeli yanıt veriyor: yüksek hacim, çok kanal ve tekrar. Bunları kanıtlanmış Rus doktrini olarak değil, yorumlayıcı modeller olarak kullanıyorum. Hangi altyapıyla sorusunun yanıtı ise ödünç alınmış güvenilirlik: okurlar haberin güvenilirliğini çoğu zaman marka ve görünüm gibi kısa yollarla değerlendirir. Bennett ve Livingston dezenformasyonu “haber ya da belgesel biçimini taklit eden kasıtlı yanlışlar” olarak tanımlar; klon haber sitesi bu tanımın en doğrudan örneğidir. Wardle ve Derakhshan’ın çerçevesinde de bu siteler üretim ve dağıtım altyapısıdır.","seconds":75,"visual":"steps","citations":["miskimmon2013","paul2016","bennett2018","wardle2017"],"source":"Miskimmon et al., 2013; Paul & Matthews, 2016; Bennett & Livingston, 2018; Wardle & Derakhshan, 2017","steps":[["Neden · stratejik anlatı","“Yaptırımlar Almanya’ya zarar veriyor” → Batı’nın çöküşü (Miskimmon vd., 2013)"],["Nasıl · yorumlayıcı modeller","Yansıtıcı kontrol; “yalan hortumu”: hacim, çok kanal, tekrar (Paul ve Matthews, 2016)"],["Hangi altyapıyla · ödünç güvenilirlik","Tanıdık marka görünümü; haber biçimini taklit eden yanlışlar (Bennett ve Livingston, 2018)"],["Bilgi düzensizliği","Üretim ve dağıtım altyapısı (Wardle ve Derakhshan, 2017)"]],"visible_word_count":30},{"id":"context","title":"Doppelgänger 2022–2025: ifşa, atıf, evrim","kicker":"VAKA","display_points":["27.09.2022: Meta ve EU DisinfoLab aynı gün ifşa etti","Atıf: SDA ve Structura (Meta, 2023; ABD, AB)"],"takeaway":"2022 göstergeleri dört yıllık operasyonun ilk evresidir.","notes":"EU DisinfoLab, kampanyanın en az Mayıs 2022’den beri sürdüğünü raporladı.\nRapor, Bild, Spiegel, The Guardian ve ANSA gibi en az 17 markanın taklit edildiğini gösterdi.\nMeta aynı gün ağı kaldırdığını ve öncelikli hedefin Almanya olduğunu açıkladı.\nMeta ayrıca alan adı göstergelerini açık bir CSV dosyası olarak yayımladı.","cue_sentences":["27 Eylül 2022’de Meta ve EU DisinfoLab aynı gün ifşa etti; Meta 1.633 hesap ve 703 sayfa kaldırdı.","2022’de operatör belirsizdi; 2023’te Meta, sonra Fransa, AB ve ABD Sosyal Tasarım Ajansı ile Structura’yı işaret etti.","Operasyon sonra evrildi: Almanya’da 50 binden fazla sahte X hesabı, yapay zekâ içerikleri, el konan sitelerin yerine yenileri.","Bu yüzden 2022 listesi bir başlangıç anlık görüntüsüdür."],"full_notes":"Vakanın kronolojisi bulguları okumak için önemli. 27 Eylül 2022’de EU DisinfoLab ile Qurium raporunu yayımladı ve aynı gün Meta ağı kaldırdığını duyurdu; Meta 1.633 Facebook hesabı ve 703 sayfa kaldırdı, yaklaşık 105 bin dolarlık reklam harcaması ve yaklaşık 4 bin sayfa takipçisi raporladı. O tarihte operatör açıkça belirlenmemişti. Meta 2023 başında ağı Sosyal Tasarım Ajansı ile Structura’ya bağladı; ardından Fransa, Avrupa Birliği ve ABD yaptırım ve el koyma kararlarıyla bu atfı destekledi. Bu atıf çok kaynaklı ve yüksek güvenli; Rus Başkanlık İdaresi’nin yönlendirdiği iddiası ise esas olarak ABD belgelerine dayanıyor. Operasyon daha sonra evrildi: Alman Dışişleri Bakanlığı 2024’te 50 binden fazla sahte X hesabı ve 1,8 milyon gönderi tespit etti; içerikler yapay zekâyla üretilmeye başlandı; ABD 2024’te 32 alan adına el koyduğunda yerlerine kısa sürede yenileri açıldı. Dolayısıyla incelediğim 2022 listesi operasyonun tamamı değil, ilk evresinin platform tarafından yayımlanmış bir anlık görüntüsüdür.","seconds":80,"visual":"steps","citations":["disinfolab2022","nimmo2022","auswaertiges2024","pamment2025"],"source":"Alaphilippe et al., 2022; Nimmo & Agranovich, 2022; Auswärtiges Amt, 2024; Pamment & Tsurtsumia, 2025","visible_word_count":29,"steps":[["27.09.2022 · ifşa","EU DisinfoLab raporu ve Meta kaldırması aynı gün: 1.633 hesap, 703 sayfa, ≈105 bin $ reklam"],["2023–2024 · atıf","Meta (2023), Fransa, AB ve ABD: SDA ve Structura; yaptırımlar ve alan adı el koyma"],["2024–2025 · evrim","Almanya’da 50.000+ sahte X hesabı (Auswärtiges Amt, 2024); yapay zekâ içerikleri"],["Sonuç","2022 göstergeleri operasyonun ilk evresine ait bir anlık görüntü"]]},{"id":"question","title":"Araştırma soruları ve kuramsal beklentiler","kicker":"ARAŞTIRMA SORULARI","display_points":["AS1: İfşa edilen altyapı hangi ülkeleri hedefliyor?","AS2: Alan adları hangi taklit tipini izliyor?","AS3: İfşa nerede ve ne süre görünür oldu?"],"takeaway":"Her soru için kuramdan bir beklenti var.","notes":"Birinci soru hedef coğrafyasını soruyor.\nİkinci soru alan adlarının sözcüksel yapısını soruyor.\nÜçüncü soru, kaldırma haberinin ne zaman ve hangi ülkelerin medyasında görünür olduğunu soruyor.\nİlk iki sorunun birimi alan adı, üçüncüsünün birimi haber makalesidir.","cue_sentences":["AS1 için beklenti: marka itibarının yüksek olduğu tek bir kilit ülkede yoğunlaşma.","AS2 için beklenti: yazım hatası değil, aynı markanın ucuz uzantılarda çoğaltılması.","AS3 için beklenti: kısa, tetikleyici olaya bağlı ve büyük ajanslar üzerinden dolaşan bir görünürlük."],"full_notes":"Üç araştırma sorum var ve her biri için kuramdan türetilmiş bir beklentim var. Birinci soru: ifşa edilen altyapı hangi ülkeleri hedefliyor? Ödünç güvenilirlik mantığına göre markanın yerel itibarının en yüksek olduğu kilit bir ülkede yoğunlaşma bekliyorum. İkinci soru: alan adları hangi taklit tipini izliyor? Güvenlik literatüründeki tipolojiye göre yazım hatası değil, aynı marka adının ucuz yeni uzantılarda çoğaltılmasını bekliyorum. Üçüncü soru: ifşa ne zaman ve hangi ülkelerin medyasında görünür oldu? Haber akışı kuramına göre kısa ömürlü, tetikleyici olaya bağlı ve büyük ajanslar üzerinden dolaşan bir görünürlük bekliyorum. İlk iki sorunun birimi alan adı, üçüncüsünün birimi haber makalesidir.","seconds":50,"visual":"steps","citations":["tian2018","korczynski2018","kwak2014"],"source":"Tian et al., 2018; Korczyński et al., 2018; Kwak & An, 2014","visible_word_count":34,"steps":[["AS1 · hedefleme","Beklenti: marka itibarının yüksek olduğu kilit ülkede yoğunlaşma · birim: alan adı"],["AS2 · altyapı","Beklenti: typosquatting değil, ucuz yeni uzantılarda wrongTLD (Tian vd., 2018; Korczyński vd., 2018)"],["AS3 · görünürlük","Beklenti: kısa, olay tetikli, ajans merkezli · birim: haber makalesi (Kwak ve An, 2014)"]]},{"id":"method","title":"Veri ve yöntem: iki kaynak, ayrı birimler","kicker":"VERİ VE YÖNTEM","display_points":["Meta CSV: bir uygulama kaydı, örneklem değil","GDELT GKG: 4.209 dosya, 5,9 milyon kayıt","Hedef etiketi ≠ yayın ülkesi ≠ anılan yer"],"takeaway":"Kaynak ülke, hedef ülke değildir.","notes":"Meta listesi operasyonun örneklemi değil, platformun uygulama kaydıdır; Rogers ve Righetti’nin gösterdiği gibi bu tanım zamanla değişir.\nGDELT verisini API’den değil, literatürde kullanılan ham GKG arşivinden aldım: 20 Eylül – 11 Ekim 2022, 4.209 dosya.\nHaberler iki sabit kuralla seçildi; kaynak ülke GDELT’in alan adı listesinden, anılan yerler GKG konum alanından geliyor.\nHer ölçüm kendi biriminde ve taranan bütün kayıtlarla paydalanarak raporlanıyor.","cue_sentences":["Meta listesi operasyonun örneklemi değil, platformun uygulama kaydıdır; Rogers ve Righetti’nin gösterdiği gibi bu tanım zamanla değişir.","GDELT verisini API’den değil, literatürde kullanılan ham GKG arşivinden aldım: 20 Eylül – 11 Ekim 2022, 4.209 dosya.","Haberler iki sabit kuralla seçildi; kaynak ülke GDELT’in alan adı listesinden, anılan yerler GKG konum alanından geliyor.","Her ölçüm kendi biriminde ve taranan bütün kayıtlarla paydalanarak raporlanıyor."],"full_notes":"Yöntem iki veri kaynağına dayanıyor. Birincisi Meta’nın sabit commit bağlantısıyla arşivlenen CSV dosyası; hedef ülkeyi kaynak yorum alanından alıyorum, uzantıdan veya IP adresinden tahmin etmiyorum. İkincisi GDELT. GDELT verisini canlı bir API sorgusundan değil, akademik GDELT çalışmalarında kullanılan ham Küresel Bilgi Grafiği arşivinden aldım. Meta duyurusunu kapsayan 20 Eylül – 11 Ekim 2022 penceresindeki bütün on beş dakikalık İngilizce ve çeviri dosyalarını, toplam 4.209 dosyayı ve yaklaşık 5,9 milyon haber kaydını taradım. Haberleri iki sabit kuralla seçtim: kampanya adı ile Rusya bağlamı, ya da Meta veya Facebook ile Rusya ve ağ, sahte, propaganda gibi bir terimin birlikte geçmesi. Kaynak ülkeyi GDELT’in 2018 alan adı–ülke listesinden, anılan yerleri ise aynı haberlerin konum alanından aldım. Günlük ve ülke bazında bütün taranan kayıtları payda olarak saklıyorum.","seconds":70,"visual":"method","citations":["meta2022","gdeltgkg","gdeltdomains2018","rogers2025","hoffmann2022"],"source":"Meta, 2022; The GDELT Project, 2015, 2018; Rogers & Righetti, 2025; Hoffmann et al., 2022","visible_word_count":34},{"id":"audit","title":"Denetlenmiş analiz kümesi 311 benzersiz alan adıdır.","kicker":"VERİ HAZIRLIĞI","display_points":["350 kayıt → 313 alan adı satırı → 311 benzersiz alan adı"],"takeaway":"Farklı kayıt türleri aynı paydada toplanmadı.","notes":"Ham dosyada 350 kayıt, alan adı türünde 313 satır bulunuyor.\nİki yinelenen değer çıkarılınca analiz kümesi 311 oluyor.\nCIB ve Telegram bağlantıları farklı birimler olduğu için bu sayımdan ayrıldı.\nHer dönüşüm kaynak satırına ve dosya özetine bağlandı.","cue_sentences":["Ham dosyada 350 kayıt, alan adı türünde 313 satır bulunuyor.","İki yinelenen değer çıkarılınca analiz kümesi 311 oluyor.","CIB ve Telegram bağlantıları farklı birimler olduğu için bu sayımdan ayrıldı.","Her dönüşüm kaynak satırına ve dosya özetine bağlandı."],"full_notes":"Veri hazırlığında üç toplamı ayırıyorum. Ham dosya üç yüz elli kayıt içeriyor. Alan adı türündeki satırları seçtiğimde üç yüz on üç kayıt kalıyor. Küçük harfe dönüştürülmüş tam alan adı üzerinde tekilleştirme iki yinelenen değer buluyor ve analiz kümesi üç yüz on bire iniyor. Dosyadaki yirmi iki CIB bağlantısı ile on beş Telegram bağlantısını bu toplama eklemiyorum; çünkü bunlar aynı analiz birimi değil. Hedef ülkeyi kaynağın yorum alanındaki açık etiketten alıyorum. Çoklu hedef kategorisini ülkelere çoğaltmadan ayrı tutuyorum. Bu işlemler, birincil dosyadan yeniden üretilebiliyor. Dolayısıyla birazdan göreceğimiz her sayı, belirsiz bir harita yoğunluğuna değil, tanımlanmış kayıtlar ve açık dönüşüm kurallarına dayanıyor.","seconds":35,"visual":"audit","citations":["meta2022"],"source":"Meta, 2022","visible_word_count":25},{"id":"validity","title":"GDELT verisi test edilebilir: MD5, payda, isabet","kicker":"YÖNTEM / TEST EDİLEBİLİRLİK","display_points":["4.209 / 4.209 dosya MD5 ile doğrulandı","5.944.850 kayıt tarandı; 511 tekil haber","Örneklem isabeti: %90,6 (n = 32)"],"takeaway":"Aynı komut, aynı dosyalarla aynı sayıları üretir.","notes":"Her arşiv dosyası, GDELT’in yayımladığı MD5 özetiyle karşılaştırıldı; 4.209 dosyanın hepsi eşleşti.\nToplam 5.944.850 haber kaydı tarandı ve 511 tekil haber kurallarla eşleşti.\nSabit tohumlu rastgele 32 başlıkta isabet yüzde 90,6; yüzde 95 güven aralığı 76 ile 97 arasında.\nYanlış pozitifler kayıtlı; örneğin Putin’in dublörleri haberi. İkinci kodlayıcı için sütun açık.","cue_sentences":["Her arşiv dosyası, GDELT’in yayımladığı MD5 özetiyle karşılaştırıldı; 4.209 dosyanın hepsi eşleşti.","Toplam 5.944.850 haber kaydı tarandı ve 511 tekil haber kurallarla eşleşti.","Sabit tohumlu rastgele 32 başlıkta isabet yüzde 90,6; yüzde 95 güven aralığı 76 ile 97 arasında.","Yanlış pozitifler kayıtlı; örneğin Putin’in dublörleri haberi. İkinci kodlayıcı için sütun açık."],"full_notes":"GDELT verisinin güvenilirliğini üç testle gösteriyorum. Birincisi bütünlük: indirdiğim 4.209 ham dosyanın her birini GDELT’in kendi yayımladığı MD5 özetiyle karşılaştırdım; hepsi eşleşti, hiçbir dosya düşmedi. İkincisi kapsam ve payda: 5.944.850 haber kaydı tarandı; eşleşen 511 tekil haberi, aynı gün ve aynı ülkedeki bütün kayıtlara oranlayabiliyorum. Üçüncüsü isabet: Wang ve arkadaşlarının uyardığı gibi otomatik kodlamaya körü körüne güvenmemek için sabit tohumla rastgele 32 başlık çektim ve tek tek kodladım. 29’u gerçekten Meta’nın kaldırma haberi ya da kampanya haberiydi; isabet yüzde 90,6, Wilson yüzde 95 güven aralığı 76 ile 97 arası. Yanlış pozitifleri, örneğin Putin’in dublörleri haberini, kayıtta tutuyorum. Birinci kodlama yapay zekâ destekli bir ön kodlamadır; ikinci insan kodlayıcı için sütun hazır ve uyum katsayısı otomatik hesaplanıyor. Bütün süreç tek komutla yeniden üretilebiliyor ve birim testleriyle korunuyor.","seconds":60,"visual":"validity","citations":["gdeltgkg","wang2016","hammond2014"],"source":"The GDELT Project, 2015; Wang et al., 2016; Hammond & Weidmann, 2014","visible_word_count":33},{"id":"countries","title":"Almanya, bu listenin hedef coğrafyasında baskındır.","kicker":"BULGU 1 / AS1 · HEDEF ÜLKE","display_points":["Almanya: 298/311 (%95,8)","Birleşik Krallık 4; Fransa 2; İtalya 2."],"takeaway":"Bu oran, yayımlanmış vakanın dağılımını betimler.","notes":"Listenin 298 kaydı Almanya hedefli; bütün listedeki payı yüzde 95,8.\nBirleşik Krallık, Fransa ve İtalya birlikte sekiz kayıttır.\nKalan beş kayıt Letonya, Ukrayna ve çoklu hedef kategorilerindedir.\nBu bir hedefleme önceliği ve yatırımdır, erişim değil; etiket Meta’nın yargısıdır ve Meta metni Fransa, İtalya, Ukrayna ve Birleşik Krallık’ı da sayar.","cue_sentences":["Listenin 298 kaydı Almanya hedefli; bütün listedeki payı yüzde 95,8.","Birleşik Krallık, Fransa ve İtalya birlikte sekiz kayıttır.","Kalan beş kayıt Letonya, Ukrayna ve çoklu hedef kategorilerindedir.","Bu bir hedefleme önceliği ve yatırımdır, erişim değil; etiket Meta’nın yargısıdır ve Meta metni Fransa, İtalya, Ukrayna ve Birleşik Krallık’ı da sayar."],"full_notes":"İlk bulgu, Almanya hedefli etiketlerin açık ağırlığıdır. Üç yüz on bir benzersiz alan adının iki yüz doksan sekizi bu etiketi taşıyor; bütün listedeki pay yüzde doksan beş virgül sekiz. Birleşik Krallık dört, Fransa iki, İtalya iki göstergeyle yer alıyor. Letonya üç, Ukrayna bir, çoklu hedef kategorisi de bir kayıt içeriyor. Tek bir ülkenin bu kadar baskın olduğu dağılımı yatay çubuk grafik daha doğrudan anlatıyor. Küçük ülkeleri ayrı uzun bölümlere ayırmak yerine aynı tabloda birlikte gösteriyorum. Bu, yayımlanan vakanın hedef yönelimidir. Yoğunlaşmanın ne kadarının faaliyet, ne kadarının tespit veya yayımlama seçimiyle ilgili olduğunu ayıracak ek veri bulunmadığından, grafiği Avrupa’daki bütün operasyonların sıralaması olarak yorumlamıyorum.","seconds":70,"visual":"countries","citations":["meta2022"],"source":"Meta, 2022","metric":{"numerator":298,"denominator":311,"percentage":95.8},"visible_word_count":22},{"id":"tlds","title":"Marka sabit, uzantı değişken: wrongTLD deseni","kicker":"BULGU 2 / AS2 · SON DNS ETİKETİ","display_points":["En sık altı uzantı: 240/311 (%77,2)","Typosquatting değil, wrongTLD (Tian vd., 2018)"],"takeaway":"Ucuz yeni uzantılarda atılabilir, engellemeye dayanıklı altyapı.","notes":"En sık altı son etiket online, website, site, space, pw ve fun; toplam 240 alan adı.\nMarka adı aynen korunup yalnız uzantı değiştiği için bu, Tian ve arkadaşlarının tipolojisinde typosquatting değil wrongTLD işgalidir.\nKorczyński ve arkadaşları kötüye kullanımın ucuz yeni uzantılarda yoğunlaştığını gösterir; bu desen engellemeye dayanıklı, atılabilir bir altyapıya işaret eder.\nFiyat verisi yok; “ucuz” bir çıkarımdır, ölçüm değil.","cue_sentences":["En sık altı son etiket online, website, site, space, pw ve fun; toplam 240 alan adı.","Marka adı aynen korunup yalnız uzantı değiştiği için bu, Tian ve arkadaşlarının tipolojisinde typosquatting değil wrongTLD işgalidir.","Korczyński ve arkadaşları kötüye kullanımın ucuz yeni uzantılarda yoğunlaştığını gösterir; bu desen engellemeye dayanıklı, atılabilir bir altyapıya işaret eder.","Fiyat verisi yok; “ucuz” bir çıkarımdır, ölçüm değil."],"full_notes":"İkinci bulgu, alan adının en sağındaki etikete bakıyor. Online elli üç, website elli, site kırk altı, space kırk iki, pw yirmi sekiz ve fun yirmi bir kez geçiyor. Altı etiket toplam iki yüz kırk alan adını, yani listenin yüzde yetmiş yedi virgül ikisini kapsıyor. Bu iki yüz kırk kaydın tamamı Almanya hedefli. Böylece coğrafi yoğunlaşmayı yalnız bir ülke toplamı olarak değil, belirli bir adres dağılımıyla birlikte görebiliyoruz. Ancak etiketin sık kullanılması, ucuz olduğunu kanıtlamaz; bunun için döneme ait tescil veya fiyat verisi gerekir. Etiket barındırma ülkesini de göstermiyor. Hesap, kaydın en sağındaki DNS etiketi üzerinden yapıldığı için etkin kayıt son ekiyle karıştırılmamalı.","seconds":65,"visual":"tlds","citations":["meta2022","tian2018","korczynski2018"],"source":"Meta, 2022; Tian et al., 2018; Korczyński et al., 2018","metric":{"numerator":240,"denominator":311,"percentage":77.2},"visible_word_count":25},{"id":"reuse","title":"Aynı ilk DNS etiketi farklı son etiketlerle yinelenir.","kicker":"BULGU 3 / AS2 · İLK DNS ETİKETİ","display_points":["93 ayrı ilk etiket","75 tekrarlanan grup; 293 adres"],"takeaway":"Adres çeşitliliği, yinelenen ilk etiketler çevresinde oluşur.","notes":"Alan adları, soldaki ilk DNS etiketinin tam eşleşmesine göre gruplandı.\n93 ayrı ilk etiketin 75’i birden fazla son etiketle yer alıyor.\nBu gruplar 293 adresi kapsıyor; spiegel dokuz, bild sekiz, dailymail üç örnek içeriyor.\nDize tekrarı, sahiplik veya içerik hakkında bağımsız hüküm vermiyor.","cue_sentences":["Alan adları, soldaki ilk DNS etiketinin tam eşleşmesine göre gruplandı.","93 ayrı ilk etiketin 75’i birden fazla son etiketle yer alıyor.","Bu gruplar 293 adresi kapsıyor; spiegel dokuz, bild sekiz, dailymail üç örnek içeriyor.","Dize tekrarı, sahiplik veya içerik hakkında bağımsız hüküm vermiyor."],"full_notes":"Üçüncü bulgu, tam olarak aynı ilk DNS etiketinin yeniden kullanımını inceliyor. Üç yüz on bir alan adında doksan üç farklı ilk etiket var. Bunların yetmiş beşi birden fazla son etiketle birlikte kullanılıyor ve iki yüz doksan üç adres bu gruplarda toplanıyor. Örneğin spiegel ilk etiketi dokuz farklı son etiketle, bild sekiz, dailymail ise üç farklı son etiketle yer alıyor. Burada yazım benzerliğini yorumlayan bir model kullanmadım; yalnızca tam dize eşleşmesini saydım. Bu tercih, ölçümü yeniden üretilebilir ve denetlenebilir tutuyor. Sonuç, listede adres çeşitliliğinin önemli bir bölümünün yinelenen ilk etiketler çevresinde oluştuğunu gösteriyor. Ortak sahiplik, aynı operatör veya içerik taklidi için ise bu sayımın ötesinde kanıt gerekir.","seconds":55,"visual":"reuse","citations":["meta2022"],"source":"Meta, 2022","visible_word_count":24},{"id":"gdelt_wave","title":"Görünürlük iki günlük bir dalgadır","kicker":"BULGU 4 / AS3 · ZAMAN","display_points":["27.09: 392 haber; 28.09: 100 haber","511 haberin %96,3’ü ilk iki günde","145 farklı başlık: yoğun ajans dağıtımı"],"takeaway":"Kaldırma haberi kısa ömürlü bir haber olayıdır.","notes":"Meta’nın duyurduğu 27 Eylül’de 392 haber, ertesi gün 100 haber var.\n511 haberin yüzde 96,3’ü bu iki günde; sonra görünürlük hızla sönüyor.\nÇizgi, aynı gün taranan bütün kayıtlara oranı gösteriyor; zirve haber hacmindeki dalgalanmadan kaynaklanmıyor.\n511 adres yalnız 145 farklı başlık taşıyor; aynı ajans haberi çok sayıda sitede yayımlanmış.","cue_sentences":["Meta’nın duyurduğu 27 Eylül’de 392 haber, ertesi gün 100 haber var.","511 haberin yüzde 96,3’ü bu iki günde; sonra görünürlük hızla sönüyor.","Çizgi, aynı gün taranan bütün kayıtlara oranı gösteriyor; zirve haber hacmindeki dalgalanmadan kaynaklanmıyor.","511 adres yalnız 145 farklı başlık taşıyor; aynı ajans haberi çok sayıda sitede yayımlanmış."],"full_notes":"Dördüncü bulgu zamana ilişkin. Grafik her gün kurallarla eşleşen haber sayısını çubuk olarak, aynı gün taranan bütün GDELT kayıtlarına oranını ise çizgi olarak gösteriyor. Meta’nın duyuru yaptığı 27 Eylül’de 392 haber, ertesi gün 100 haber var; 511 haberin yüzde 96,3’ü bu iki günde toplanıyor. Oran çizgisi aynı şekli izliyor, yani zirve günlük haber hacmindeki bir artıştan kaynaklanmıyor. Duyurudan önce yalnızca bir haber var ve o da Almanya’daki Facebook tartışmasına ilişkin. Bir başka önemli nokta ajans dağıtımı: 511 farklı adres yalnızca 145 farklı başlık taşıyor; örneğin “Meta disables Russian propaganda network targeting Europe” başlığı onlarca yerel sitede yayımlanmış. Dolayısıyla görünürlük, bağımsız haber üretiminden çok ajans haberinin yeniden yayımlanmasıyla çoğalıyor. Kaldırma haberi kısa ömürlü bir haber olayı olarak görünüyor.","seconds":65,"visual":"gdelt_wave","citations":["gdeltgkg","leetaru2013"],"source":"The GDELT Project, 2015 (GKG 2.0 ham arşivi); bu çalışmanın taraması","visible_word_count":30},{"id":"gdelt_map","title":"Almanya hakkında, ama Almanya’da değil","kicker":"BULGU 5 / AS3 · MEKÂN","display_points":["Yayın ülkesi: ABD 373, Almanya 29, İtalya 13","100 bin kayıt başına: ABD 25,4; Almanya 15,4","Haberlerin %63,6’sı Almanya’yı anıyor"],"takeaway":"Hipotez: hedef kamuoyu ifşayı en az gören olabilir.","notes":"Harita gün gün birikiyor: renk, haberin yayımlandığı ülke.\nMeta hedeflerinin yüzde 95,8’i Almanya iken haberlerin yalnız 29’u, yani yüzde 5,7’si Alman kaynaklı; 373 haber ABD kaynaklı.\nTaranan kayıt sayısına oranlandığında Almanya ikinci sırada: 100 bin kayıtta 15,4 haber.\nNoktalar haberlerde anılan yerler; haberlerin yüzde 63,6’sı Almanya’yı anıyor. Bu bir hipotezdir: Almanca akışta kaçırılan haber oranı ölçülmeden kanıt sayılmaz.","cue_sentences":["Harita gün gün birikiyor: renk, haberin yayımlandığı ülke.","Meta hedeflerinin yüzde 95,8’i Almanya iken haberlerin yalnız 29’u, yani yüzde 5,7’si Alman kaynaklı; 373 haber ABD kaynaklı.","Taranan kayıt sayısına oranlandığında Almanya ikinci sırada: 100 bin kayıtta 15,4 haber.","Noktalar haberlerde anılan yerler; haberlerin yüzde 63,6’sı Almanya’yı anıyor. Bu bir hipotezdir: Almanca akışta kaçırılan haber oranı ölçülmeden kanıt sayılmaz."],"full_notes":"Beşinci bulgu mekâna ilişkin ve haritada kendiliğinden oynuyor. Renk tonu haberin yayımlandığı ülkeyi gösteriyor; harita duyuru günlerinden itibaren gün gün birikiyor. Mutlak sayılarda tablo çok net: 511 haberin 373’ü ABD kaynaklı, Almanya 29, İtalya 13 haberle izliyor. Meta göstergelerinde Almanya’nın payı yüzde 95,8 iken haber kaynakları içinde Almanya’nın payı yalnızca yüzde 5,7. Ancak GDELT’in ABD kaynaklarını çok daha fazla izlediğini hesaba katmak gerekiyor; bu yüzden aynı dönemde her ülkeden taranan bütün kayıtlara oranladım. Bu durumda ABD’de 100 bin kayıtta 25,4, Almanya’da 15,4 haber var; Almanya ikinci sıraya çıkıyor, İtalya 5,4 ile üçüncü. Noktalar haberlerde anılan yerler: haberlerin yüzde 63,6’sı Almanya’yı, yüzde 57’si Fransa ve İtalya’yı anıyor. Yani hedeflenen ülkeler haberlerin konusu, ama haberin üretildiği yer ağırlıkla ABD ve İngilizce medya. Bu bir görünürlük ölçüsüdür; okurun bulunduğu yeri veya etkiyi göstermez.","seconds":100,"visual":"gdelt_map","citations":["gdeltgkg","gdeltdomains2018","kwak2014","meta2022"],"source":"The GDELT Project, 2015, 2018; Kwak & An, 2014; Meta, 2022","visible_word_count":33},{"id":"discussion","title":"Altyapı ≠ erişim ≠ etki ≠ görünürlük","kicker":"TARTIŞMA I","display_points":["Bu çalışma birinci ve beşinci katmanı ölçüyor","Büyük altyapı, küçük otantik kitle"],"takeaway":"Erişim ve etki ölçülmedi; “yoktu” denmiyor.","cue_sentences":["Literatür beş katmanı ayırır: altyapı, erişim, etkileşim, etki ve ifşanın görünürlüğü.","Bu çalışma yalnız altyapıyı ve ifşanın görünürlüğünü ölçüyor.","Meta 2022: yaklaşık 4 bin sayfa takipçisi; büyük altyapı, küçük otantik kitle.","Eady ve arkadaşları: Rus IRA maruziyeti kullanıcıların yüzde 1’inde yoğunlaşmış, oy davranışıyla ilişki saptanmamış; ama bu bulgu doğrudan Doppelgänger’e aktarılamaz."],"notes":"Literatür beş katmanı ayırır: altyapı, erişim, etkileşim, etki ve ifşanın görünürlüğü.\nBu çalışma yalnız altyapıyı ve ifşanın görünürlüğünü ölçüyor.\nMeta 2022: yaklaşık 4 bin sayfa takipçisi; büyük altyapı, küçük otantik kitle.\nEady ve arkadaşları: Rus IRA maruziyeti kullanıcıların yüzde 1’inde yoğunlaşmış, oy davranışıyla ilişki saptanmamış; ama bu bulgu doğrudan Doppelgänger’e aktarılamaz.","full_notes":"Bulguları yorumlarken beş katmanı ayırmak gerekiyor: altyapı, erişim, etkileşim, etki ve ifşanın görünürlüğü. Bu çalışma yalnızca birinci ve beşinci katmanı ölçüyor. Meta’nın 2022 raporu büyük bir altyapıya karşılık küçük bir otantik kitle bildiriyor: yaklaşık 4 bin sayfa takipçisi ve 105 bin dolarlık reklam. Genel literatür de benzer bir tablo çiziyor: Eady ve arkadaşları 2016 ABD seçiminde Rus İnternet Araştırma Ajansı içeriklerine maruziyetin kullanıcıların yüzde 1’inde yoğunlaştığını ve tutum ya da oy davranışıyla ilişki saptanmadığını gösterdi. Ancak bu bulguyu Doppelgänger’e doğrudan aktaramayız; Almanya’da web izleme ya da panel verisiyle yapılmış bir maruziyet çalışması yok. Dolayısıyla “etki yoktu” demiyorum; erişim ve etki bu çalışmada ölçülmedi.","seconds":80,"visual":"table","citations":["nimmo2022","eady2023","pamment2025"],"source":"Nimmo & Agranovich, 2022; Eady et al., 2023; Pamment & Tsurtsumia, 2025","table":{"headers":["Katman","Ne ölçülür","Bu çalışma"],"rows":[["1 · Altyapı","Alan adı, hesap, sayfa","Ölçüldü (311 alan adı)"],["2 · Erişim","Kaç kişi gördü","Ölçülmedi"],["3 · Etkileşim","Beğeni, paylaşım, tıklama","Ölçülmedi (Meta: ≈4.000 takipçi)"],["4 · Etki","Tutum, davranış","Ölçülmedi (Eady vd., 2023)"],["5 · İfşa görünürlüğü","Haber hacmi ve coğrafyası","Ölçüldü (511 haber)"]]},"visible_word_count":25},{"id":"discussion2","title":"Algı korsanlığı ve seçilim sorunu","kicker":"TARTIŞMA II","display_points":["İfşanın görünürlüğü operatörün işine yarayabilir","Alarmist dil kendi başına zarar verebilir"],"takeaway":"Görünür olan operasyon değil, ifşasıdır.","cue_sentences":["Gleicher’in algı korsanlığı kavramı: operatörler olduklarından daha etkili görünmek ister.","Pamment ve Tsurtsumia: sızan SDA belgeleri, Batı’daki haberlerin müşteriye başarı kanıtı olarak sunulduğunu gösteriyor.","Jungherr ve Rauchfleisch: alarmist dezenformasyon söylemi demokrasiden memnuniyeti düşürüyor; bu sunumun dili için de geçerli.","Seçilim: platform neyi kaldırıp yayımlayacağını, medya neyi haber yapacağını seçti."],"notes":"Gleicher’in algı korsanlığı kavramı: operatörler olduklarından daha etkili görünmek ister.\nPamment ve Tsurtsumia: sızan SDA belgeleri, Batı’daki haberlerin müşteriye başarı kanıtı olarak sunulduğunu gösteriyor.\nJungherr ve Rauchfleisch: alarmist dezenformasyon söylemi demokrasiden memnuniyeti düşürüyor; bu sunumun dili için de geçerli.\nSeçilim: platform neyi kaldırıp yayımlayacağını, medya neyi haber yapacağını seçti.","full_notes":"İkinci tartışma noktası ifşanın kendisinin bir etki aracına dönüşebilmesi. Meta’nın Nathaniel Gleicher’ının “algı korsanlığı” dediği şey, operatörlerin olduklarından daha etkili görünmeye çalışmasıdır. Pamment ve Tsurtsumia’nın sızan 3 binden fazla Sosyal Tasarım Ajansı belgesine dayanan değerlendirmesi, Batı medyasındaki haberlerin müşteriye başarı kanıtı olarak sunulduğunu ve etkinin abartıldığını gösteriyor. Jungherr ve Rauchfleisch ise alarmist dezenformasyon söyleminin kendi başına demokrasiden memnuniyeti düşürdüğünü deneysel olarak gösterdi; bu, benim sunumumun dili için de bir uyarı. Son olarak bir seçilim zinciri var: platform neyi kaldırıp yayımlayacağını, medya neyi ne kadar haber yapacağını, araştırmacı da hangi anahtar sözcüklerle arayacağını seçiyor. Bu yüzden “görünmez cephe” tezini şöyle kuruyorum: kamuoyunun gördüğü şey operasyonun kendisi değil, büyük ölçüde ifşasıdır.","seconds":75,"visual":"steps","citations":["pamment2025","jungherr2024","rogers2025"],"source":"Pamment & Tsurtsumia, 2025; Jungherr & Rauchfleisch, 2024; Rogers & Righetti, 2025","steps":[["Algı korsanlığı","Operatörler olduklarından etkili görünmek ister (Gleicher; Meta, 2023)"],["SDA belgeleri","Batı haberleri müşteriye başarı kanıtı olarak sunuldu (Pamment ve Tsurtsumia, 2025)"],["Alarmist söylem","Demokrasiden memnuniyeti düşürür (Jungherr ve Rauchfleisch, 2024)"],["Üçlü seçilim","Platform → medya → araştırmacı (Rogers ve Righetti, 2025)"]],"visible_word_count":21},{"id":"limits","title":"Sınırlılıklar","kicker":"SINIRLILIKLAR","display_points":["Meta listesi: alt sınır ve 2022 anlık görüntüsü","GDELT: İngilizce ağırlıklı; yayın ülkesi çıkarımsal","Kaçırılan haber ölçülmedi; tek kodlayıcı"],"takeaway":"Bulgular betimseldir; niyet veya etki iddiası yoktur.","notes":"Meta listesi bir örneklem değil, platformun tespit ve yayımlama seçimidir; bütün kayıtların tarihi aynı.\nGDELT yalnız izlediği kaynakları kapsar; ABD kaynakları fazla temsil edilir, bu yüzden oranlı ölçü de verildi.\nKaynak ülke listesi 2018 tarihli ve okurun değil, yayının ülkesini verir.\nKural isabeti yüzde 90,6; otomatik konumlar hata içerebilir (Hammond ve Weidmann, 2014).","cue_sentences":["Meta listesi bir örneklem değil, platformun tespit ve yayımlama seçimidir; bütün kayıtların tarihi aynı.","GDELT yalnız izlediği kaynakları kapsar; ABD kaynakları fazla temsil edilir, bu yüzden oranlı ölçü de verildi.","Kaynak ülke listesi 2018 tarihli ve okurun değil, yayının ülkesini verir.","Kural isabeti yüzde 90,6; otomatik konumlar hata içerebilir (Hammond ve Weidmann, 2014)."],"full_notes":"Bulguların sınırlarını açıkça belirtmek istiyorum. Meta listesi olasılıklı bir örneklem değil; platformun tespit ve yayımlama seçimini yansıtıyor ve bütün kayıtların tarihi aynı olduğu için faaliyetin zaman içindeki seyri çıkarılamıyor. GDELT yalnızca izlediği kaynakları kapsıyor ve bu kapsam ülkeler ve diller arasında eşit değil; ABD kaynaklarının fazla temsilini dengelemek için ülke bazında oranlı ölçü verdim. Kaynak ülke, GDELT’in 2018 tarihli alan adı listesinden geliyor ve haberin yayın ülkesini gösteriyor, okurun bulunduğu ülkeyi değil. Eşleşme kurallarının isabeti örneklemde yüzde 90,6; tamamı değil. Yanlış negatifleri, yani kuralların kaçırdığı haberleri ölçmedim. Son olarak Hammond ve Weidmann’ın gösterdiği gibi otomatik kodlanmış konumlar hata içerebilir. Bu nedenle bulgular betimseldir; niyet, maruziyet veya etki hakkında iddia taşımaz.","seconds":60,"visual":"steps","citations":["rogers2025","hoffmann2022","wang2016"],"source":"Rogers & Righetti, 2025; Hoffmann et al., 2022; Wang et al., 2016","visible_word_count":27,"steps":[["Meta listesi","Uygulama kaydı ve alt sınır; Almanya etiketi Meta’nın yargısı; atıf geriye dönük"],["GDELT kapsamı","Yalnız izlenen kaynaklar; ABD/İngilizce ağırlık; ülke listesi 2018, çıkarımsal"],["Geçerlilik","İsabet %90,6 (n = 32); kaçırılan haber ölçülmedi; tek, YZ destekli kodlayıcı"],["Çıkarım","Betimsel bulgular; erişim, etki ve niyet iddiası yok"]]},{"id":"conclusion","title":"Sonuç: güveni ödünç alan altyapı, uzakta kalan görünürlük","kicker":"SONUÇ","display_points":["AS1: Almanya %95,8 (298/311)","AS2: wrongTLD; 75 marka etiketi tekrarlanıyor","AS3: iki günlük dalga; kaynak ağırlıkla ABD"],"takeaway":"Görünmez cephe: hedef kamu operasyonu değil, ifşasını görüyor.","notes":"AS1: Göstergelerin yüzde 95,8’i Almanya hedefli.\nAS2: Altı son etiket 240 adresi kapsıyor; 75 ilk etiket farklı son etiketlerle tekrar ediyor.\nAS3: Kaldırma haberi iki günlük bir dalga; ağırlıkla ABD ve İngilizce medyada görünür oldu.\nSonraki adım: ikinci kodlayıcıyla isabet ve yanlış negatif ölçümü, içerik çözümlemesi.","cue_sentences":["Doppelgänger, ucuz ve atılabilir uzantılar üzerinde güveni ödünç alan bir hibrit müdahale aracıdır.","İfşası iki gün sürdü ve hedeflenen Almanya’dan çok ABD ve İngilizce ajans ekosisteminde dolaştı.","Gelecek çalışma: 145 başlığın kör kodlaması, Almanca akışta kaçırılan haber ölçümü, web izleme paneli ve DSA veri erişimi."],"full_notes":"Araştırma sorularıma dönerek bitiriyorum. Birincisi: ifşa edilen altyapının yüzde 95,8’i Almanya’yı hedefliyor. İkincisi: bu altyapı yazım hatalarından değil, aynı haber markasının ucuz yeni uzantılarda çoğaltılmasından oluşuyor; yani güveni ödünç alan, atılabilir ve engellemeye dayanıklı bir altyapı. Üçüncüsü: ifşa iki günlük bir haber dalgası olarak görünür oldu ve hedeflenen Almanya’dan çok ABD ve İngilizce ajans ekosisteminde dolaştı. Bu sonuçları hibrit müdahale çerçevesine bağladığımda “görünmez cephe” tezini şöyle özetliyorum: operasyon tespit ve atıf eşiğinin altında tutuluyor; kamuoyunun gördüğü şey ise büyük ölçüde operasyonun kendisi değil, ifşası. Bu tez için sonraki adımlar belli: 145 tekil başlığın kör bir insan kodlayıcıyla yeniden kodlanması, Almanca akışta kaçırılan haberlerin ölçülmesi, ve erişimi ölçmek için web izleme paneli ile Dijital Hizmetler Yasası kapsamındaki veri erişimi. Teşekkür ederim.","seconds":65,"visual":"steps","citations":["meta2022","gdeltgkg","wigell2019"],"source":"Meta, 2022; The GDELT Project, 2015; Wigell, 2019","visible_word_count":33,"steps":[["AS1 · hedefleme","298/311 alan adı Almanya etiketli: hedefleme önceliği, erişim değil"],["AS2 · altyapı","wrongTLD: aynı marka, ucuz uzantılar; 75 marka etiketi 293 adreste"],["AS3 · lke, comment alanındaki kaynak etiketidir; IP, barındırma veya uzantıdan türetilmez.","Son DNS etiketi, son noktadan sonraki dizedir. Etkin kayıt son eki veya kayıt edilebilir alan adı sınırı hesaplanmadı.","Gövde, ilk noktadan önceki DNS etiketidir. Yalnız tam dize eşitliği kullanıldı; benzerlik veya ortak operatör tahmini yapılmadı.","Bütün ds değerleri 2022-09-27. Bu alan tescil, faaliyet başlangıcı veya olay zaman çizelgesi değildir."]},{"title":"GDELT arşiv protokolü ve test edilebilirlik","kind":"bullets","source":"The GDELT Project, 2015, 2018; bu çalışmanın arşiv taraması.","notes":"Ek materyal; soru-cevap için. Sorgu ve pencere scripts/gdelt_common.py içinde sabittir.","bullets":["Veri: GDELT GKG 2.0 ham 15 dakikalık dosyaları (İngilizce + çeviri akışı), 20 Eylül – 11 Ekim 2022; GDELT’in Google Cloud Storage aynası.","Doğrulama: her dosyanın boyutu ve MD5 değeri GDELT masterfilelist ile karşılaştırılır; uyuşmayan dosya sayılmaz, manifestte kalır.","R1: başlık/URL’de “doppelgänger” + Rusya bağlamı (terim ya da GKG konumu RS). R2: Meta/Facebook + Rusya + ağ/sahte/dezenformasyon terimi.","Kaynak ülke: GDELT 2018 alan adı–ülke listesi (haberin yayın ülkesi; hedef ya da okur ülkesi değil). Noktalar: aynı haberlerin V2Locations alanı.","İsabet: sabit tohumlu (2022) rastgele örneklem, kural başına ≤ 30 başlık; Wilson %95 güven aralığı. İkinci kodlayıcı sütunu açıktır."]},{"title":"Bütün hedef etiketleri","kind":"table","source":"Meta, 2022; bu çalışmanın yeniden sayımı.","notes":"Ek materyal; ana anlatım süresine dahil değildir.","headers":["Kaynak hedef etiketi","Benzersiz alan adı"],"rows":[["Almanya","298"],["Birleşik Krallık","4"],["Letonya","3"],["Fransa","2"],["İtalya","2"],["Ukrayna","1"],["Çoklu hedef","1"]]},{"title":"Son DNS etiketlerinin tam dağılımı (1/2)","kind":"table","source":"Meta, 2022; bu çalışmanın yeniden sayımı.","notes":"Ek materyal; ana anlatım süresine dahil değildir.","headers":["Son etiket","Sayı","Liste payı"],"rows":[[".online","53","1  GEO=GEO||geo();const map=L.map('gm-map',{keyboard:false,zoomSnap:.25,minZoom:1,maxZoom:7,worldCopyJump:false,attributionControl:true});G.map=map;map.setView([50,10],3);map.attributionControl.setPrefix('Leaflet 1.9.4');map.attributionControl.addAttribution('Sınırlar: Natural Earth · Veri: The GDELT Project');

 const panel=$('gm-panel');if(!panel||!G.map)return;const t=stats(),s=G.snap;const dayEl=$('gm-day');if(dayEl){dayEl.hidden=!G.dayCut;if(G.dayCut){const d=G.dayCut;dayEl.innerHTML='<b>'+d.slice(6)+'.'+d.slice(4,6)+'.'+d.slice(0,4)+'</b><span>'+(d>='20220927'?'Meta duyurusundan sonra':'Meta duyurusundan önce')+' · birikimli '+nf.format(t?.total||0)+' haber</span>'}}
 G.base.setStyle(styleFor(t));G.show.meta?G.meta.addTo(G.map):G.meta.remove();
 G.points.clearLayers();const loc=s?.locations?.rows||[];if(G.show.loc&&loc.length){const mx=Math.max(...loc.map(r=>r.articles));for(const r of loc.slice(0,300))L.circleMarker([r.lat,r.lon],{radius:3+13*Math.sqrt(r.articles/mx),color:'#5b3a00',weight:1,fillColor:'#f0a43a',fillOpacity:.85}).bindTooltip('<b>'+esc(r.name)+'</b><br>'+r.articles+' haberde anıldı').addTo(G.points);G.points.addTo(G.map)}else G.points.remove();
 const empty=$('gm-empty');empty.hidden=!!(t&&t.total)||G.busy;empty.innerHTML=G.error?'<b>Veri alınamadı.</b><br>'+esc(G.error):s&&!t.total?'<b>Sorgu yanıt verdi; bu pencerede makale dönmedi.</b><br>'+esc(s.window.note||'')+'<br>Sıfır sonuç, sıfır haber anlamına gelmez.':'<b>GDELT verisi henüz yüklenmedi.</b><br>Aşağıdan “2022 penceresini sorgula” ya da kaydedilmiş JSON yükleyin. Kırmızı çerçeveler Meta hedef etiketleridir.';
 if(G.busy){panel.innerHTML='<p class="gm-chip loading">'+esc(G.progress)+'</p><p class="gm-note">GDELT 5 saniyede bir isteğe izin verir; dilimler sırayla alınır.</p>';return}
 if(!s){panel.innerHTML='<p class="gm-chip">VERİ YOK</p><dl><dt>Sorgu</dt><dd><code>'+esc(CFG.query)+'</code></dd><dt>Pencere</dt><dd>'+esc(CFG.windows.meta2022.label)+'</dd></dl>'+legend(null);return}
 const top=t.rows.slice(0,6),mx=Math.max(1,...top.map(r=>r.count));
 panel.innerHTML='<p class="gm-chip ok">'+esc(originLabel(s))+'</p><p class="gm-window">'+esc(s.window.label)+'</p><div class="gm-kpis"><div><b>'+nf.format(t.total)+'</b><span>tekil haber</span></div><div><b>'+t.rows.length+'</b><span>kaynak ülke</span></div><div><b>'+(t.total?pct(t.deN/t.total):'—')+'</b><span>Almanya kaynaklı</span></div></div>'+
 (top.length?'<ol class="gm-bars">'+top.map(r=>'<li><span>'+esc(trName(r.name))+'</span><i style="width:'+(r.count/mx*100).toFixed(1)+'%"></i><b>'+r.count+'</b></li>').join('')+'</ol>':'')+
 '<p class="gm-compare">Meta hedef etiketlerinde Almanya <b>%95,8</b> · haber kaynaklarında <b>'+(t.total?pct(t.deN/t.total):'—')+'</b>. Altı hedef ülkenin kaynak payı: <b>'+(t.total?pct(t.targetN/t.total):'—')+'</b>.</p>'+
 '<p class="gm-note">'+(s.archive?'Tarama: '+nf.format(s.archive.rows_scanned)+' GKG kaydı; kural R1 '+(s.rules?.R1_campaign||0)+' · R2 '+(s.rules?.R2_takedown||0)+'. ':'')+(s.capped_chunks?'⚠ '+s.capped_chunks+' dilim 250 sınırına ulaştı; seçki eksik olabilir. ':'')+(s.failed_chunks?'⚠ '+s.failed_chunks+' dilim yanıt vermedi. ':'')+(loc.length?'Noktalar: GKG, en sık anılan '+Math.min(loc.length,300)+' yer. ':'Nokta katmanı için GKG verisi yok. ')+(t.unmatched.length?'Haritada eşleşmeyen: '+t.unmatched.map(r=>esc(r.name)+' '+r.count).join(', ')+'.':'')+'</p>'+legend(t);
}
function legend(t){return '<div class="gm-legend"><span><i class="sw src"></i>Kaynak ülke'+(t?' (1–'+t.max+')':'')+'</span><span><i class="sw loc"></i>Anılan yer</span><span><i class="sw meta"></i>Meta hedefi</span></div>'}

/* Haber dalgası grafiği (Bulgu 4): günlük eşleşen haber (çubuk) ve 100.000 GKG kaydı başına oran (çizgi). */
window.gdeltWaveSVG=()=>{const s=G.snap;if(!s?.daily?.length)return '<p class="mini-note">GDELT günlük serisi yok. scripts/gdelt_gkg_archive.py ile üretin.</p>';
 const d=s.daily,W=620,H=330,x0=48,y0=290,bw=(W-x0)/d.length,mx=Math.max(...d.map(r=>r.matches)),rate=d.map(r=>r.all_articles?r.matches/r.all_articles*1e5:0),mr=Math.max(...rate)||1;
 const bars=d.map((r,i)=>`<rect class="wave-bar${r.day==='20220927'?' peak':''}" x="${(x0+i*bw+2).toFixed(1)}" y="${(y0-r.matches/mx*240).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(r.matches/mx*240).toFixed(1)}"><title>${r.day}: ${r.matches} haber</title></rect>`).join('');
 const line=rate.map((v,i)=>(i?'L':'M')+(x0+i*bw+bw/2).toFixed(1)+' '+(y0-v/mr*240).toFixed(1)).join(' ');
 const mi=d.findIndex(r=>r.day==='20220927'),mxI=d.findIndex(r=>r.matches===mx);
 const ticks=d.map((r,i)=>(i%3===0&&Math.abs(i-mi)>1)||i===mi?`<text class="wave-tick" x="${(x0+i*bw+bw/2).toFixed(1)}" y="${y0+20}" text-anchor="middle">${r.day.slice(6)}.${r.day.slice(4,6)}</text>`:'').join('');
 return `<svg class="wave" viewBox="0 0 ${W} ${H+20}" role="img"><defs><clipPath id="wave-cp"><rect id="wave-clip" x="0" y="0" width="${W}" height="${H+20}"/></clipPath></defs><text class="wave-axis" x="0" y="20">Günlük eşleşen haber (en çok ${mx})</text><line class="wave-base" x1="${x0}" x2="${W}" y1="${y0}" y2="${y0}"/>${ticks}<g clip-path="url(#wave-cp)">${bars}<path class="wave-line" d="${line}"/></g>${mi>=0?`<line class="wave-mark" x1="${x0+mi*bw+bw/2}" x2="${x0+mi*bw+bw/2}" y1="40" y2="${y0}"/><text class="wave-note" x="${x0+mi*bw+bw/2+6}" y="54">27.09 · Meta duyurusu</text>`:''}<text class="wave-legend" x="${W}" y="20" text-anchor="end">— 100.000 GKG kaydı başına oran</text></svg><p class="mini-note">Kaynak: GDELT GKG 2.0 ham arşivi, ${nf.format(s.archive?.rows_scanned||0)} kayıt tarandı; ${nf.format(s.unique_articles)} tekil eşleşen haber.</p>`};
window.onSlideRendered=s=>{G.dayCut=null;if(s.visual==='gdelt_map')mount();else unmount()};
// Otomatik akışta harita kendiliğinden oynar: gün gün birikim → Meta hedefleri → anılan yerler → Almanya'ya yakınlaşma.
G.days=G.snap?[...new Set(G.snap.articles.map(dayOf).filter(Boolean))].sort():[];
window.onSlideProgress=(s,f,auto)=>{if(s.visual==='gdelt_wave'){const c=document.getElementById('wave-clip');if(c)c.setAttribute('width',auto?Math.max(0,Math.min(1,f/.7))*620:620);return}if(s.visual!=='gdelt_map'||!G.map||!G.snap)return;
 if(!auto){if(G.dayCut||!G.show.meta||!G.show.loc){G.dayCut=null;G.show.meta=G.show.loc=true;paint()}return}
 if(G.daysFor!==G.snap){G.daysFor=G.snap;G.days=[...new Set(G.snap.articles.map(dayOf).filter(Boolean))].sort()}const days=G.days.length?G.days:[null],i=Math.min(days.length-1,Math.floor(f/.55*days.length)),cut=f<.55?days[i]:null,meta=f>=.4,loc=f>=.62;
 if(cut!==G.dayCut||meta!==G.show.meta||loc!==G.show.loc){G.dayCut=cut;G.show.meta=meta;G.show.loc=loc;paint()}
 if(f>=.8&&!G.zoomed){G.zoomed=true;G.map.flyToBounds([[42,-4],[57.5,24]],{duration:2,paddingTopRight:[($('gm-panel')?.offsetWidth||0)+16,0]})}
 if(f<.8&&G.zoomed){G.zoomed=false;view('eu',false)}};

if(D.gdelt&&validSnap(D.gdelt))G.snap=normalizeSnap(D.gdelt);restoreCache();paint();
